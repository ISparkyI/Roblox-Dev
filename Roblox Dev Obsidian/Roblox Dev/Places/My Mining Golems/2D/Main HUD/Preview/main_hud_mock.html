<title>Main HUD Mock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;800;900&display=swap">
<style>
/* layout: two scaled game frames (PC 1280x720, phone 844x390) stacked; HUD built with Style A tiles and pack icons */
:root{--bg:#f3f5f8;--fg:#15202e;--muted:#5d6b7e;--line:#d8dee8;--surface:#fff;--accent:#2f6bff;
  --f-body:'Rubik','Segoe UI',sans-serif;--f-hud:'Montserrat','Arial Black',sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1520;--fg:#e8eef8;--muted:#93a1b6;--line:#2a3647;--surface:#18212f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1520;--fg:#e8eef8;--muted:#93a1b6;--line:#2a3647;--surface:#18212f;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1200px;margin:0 auto}
h1{font-family:var(--f-hud);font-weight:900;font-size:24px;margin:0 0 4px}
h2{font-family:var(--f-hud);font-weight:800;font-size:17px;margin:30px 0 8px}
.lead{color:var(--muted);margin:0 0 6px;max-width:75ch}
.frame{position:relative;width:100%;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden}
.scene{position:absolute;inset:0;background:
  radial-gradient(ellipse at 50% 40%,rgba(255,196,120,.16),transparent 60%),
  repeating-linear-gradient(90deg,rgba(0,0,0,.10) 0 2px,transparent 2px 120px),
  repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 2px,transparent 2px 96px),
  linear-gradient(#3b2f2a,#5a4538 55%,#3a2e27)}
.scene::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45))}
.hud{position:absolute;inset:0;font-family:var(--f-hud)}
.abs{position:absolute}
.tw{position:absolute;display:flex;flex-direction:column;align-items:center}
.tw img{display:block;pointer-events:none}
.lab{position:relative;z-index:2;font-weight:900;color:#fff;text-align:center;line-height:1;white-space:nowrap;-webkit-text-stroke:var(--sw) #14161a;paint-order:stroke fill;letter-spacing:.01em}
.badge{position:absolute;z-index:3;background:linear-gradient(#ffe066,#ffb21a);border:3px solid #14161a;color:#14161a;font-weight:900;line-height:1;padding:3px 7px}
.plate{position:absolute;display:flex;align-items:center;background:linear-gradient(90deg,rgba(12,14,18,.86),rgba(12,14,18,.62) 62%,rgba(12,14,18,0))}
.plate img{flex:none}
.val{font-weight:900;color:#fff;-webkit-text-stroke:var(--sw) #14161a;paint-order:stroke fill;line-height:1}
.tm{position:absolute;font-weight:900;color:#e7f0ff;background:linear-gradient(90deg,rgba(12,14,18,.5),rgba(12,14,18,.28) 65%,rgba(12,14,18,0));white-space:nowrap;-webkit-text-stroke:var(--sw) #14161a;paint-order:stroke fill}
.plus{position:relative;flex:none;background:linear-gradient(#8bf24a,#35b52a);border:2px solid #14161a;display:grid;place-items:center;transform-origin:50% 50%;transition:transform .12s}
.plus:hover{transform:scale(1.1)}.plus:active{transform:scale(.92)}
.plus svg{display:block}
.pr{position:absolute;display:flex;align-items:center;gap:2px}
.pv{display:block;line-height:1;transform:translateY(.04em)}
.bt{position:absolute;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;font-weight:900;color:#e7f0ff;text-align:right;white-space:nowrap;-webkit-text-stroke:var(--sw) #14161a;paint-order:stroke fill;background:linear-gradient(270deg,rgba(12,14,18,.86),rgba(12,14,18,.5) 55%,rgba(12,14,18,0))}
.rb{position:absolute;border-radius:50%;background:rgba(18,18,22,.62);display:grid;place-items:center}
.rb svg{display:block}
table{border-collapse:collapse;width:100%;font-size:13px;margin-top:10px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500}
.cr{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:8px 0 14px}
.cc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 12px;border-radius:8px;background:linear-gradient(#4a3a30,#34281f);color:#fff;font-size:12px;min-width:104px}
.cc img{display:block}
.cc .sm{display:flex;align-items:center;gap:8px}
.ch{width:100%;font-family:var(--f-hud);font-weight:800;font-size:14px;margin:6px 0 -2px}
.cr{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 14px}
.cc{display:flex;flex-direction:column;align-items:center;padding:12px;border-radius:8px;background:linear-gradient(#4a3a30,#34281f);color:#fff;font-size:12px;text-align:center}
.cc img{display:block}
.cr{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 14px}
.cc{display:flex;flex-direction:column;align-items:center;padding:12px;border-radius:8px;background:linear-gradient(#4a3a30,#34281f);color:#fff;font-size:12px;text-align:center;gap:10px}
.cc img{display:block}
.tblwrap{overflow-x:auto}
code{font-size:12px;overflow-wrap:anywhere}
</style>
