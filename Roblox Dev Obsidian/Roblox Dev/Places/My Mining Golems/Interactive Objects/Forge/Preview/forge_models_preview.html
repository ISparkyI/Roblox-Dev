const BAR_COLORS = { Stone:0x9aa1aa, Copper:0xd9733f, Iron:0xe0e4ea };

// deterministic RNG
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const geoms = {};
for (const k in MESH) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(MESH[k], 3));
  g.computeVertexNormals(); // non-indexed -> per-face normals
  geoms[k] = g;
}
const matCache = {};
function plastic(hex){
  if (!matCache[hex]) matCache[hex] = new THREE.MeshStandardMaterial({
    color:new THREE.Color(hex).convertSRGBToLinear(), roughness:0.55, metalness:0, flatShading:true });
  return matCache[hex];
}
function part(name, hex){
  const m = new THREE.Mesh(geoms[name], plastic(hex));
  m.castShadow = m.receiveShadow = true;
  return m;
}
// bounding box half-height of a mesh (origin = bbox center)
const halfH = {};
for (const k in geoms){ geoms[k].computeBoundingBox(); halfH[k] = geoms[k].boundingBox.max.y; }

function makeScene(){
  const s = new THREE.Scene();
  s.background = new THREE.Color(0xb9d3ea).convertSRGBToLinear();
  s.add(new THREE.HemisphereLight(0xdfeeff, 0x6b6250, 0.55));
  s.add(new THREE.AmbientLight(0xffffff, 0.18));
  const sun = new THREE.DirectionalLight(0xfff4e2, 0.95);
  sun.position.set(14, 24, 10);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  const c = sun.shadow.camera; c.left = c.bottom = -16; c.right = c.top = 16; c.near = 1; c.far = 80;
  sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.02;
  s.add(sun);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200),
    new THREE.MeshStandardMaterial({ color:new THREE.Color(0x7f8b6a).convertSRGBToLinear(), roughness:0.9 }));
  ground.rotation.x = -Math.PI/2; ground.receiveShadow = true;
  s.add(ground);
  return s;
}

// ---------------------------------------------------------------- models view
const models = { scene:makeScene(), spinners:[], labels:[] };
{
  const rows = [
    ['ingot', BAR_COLORS, 'ingot'],
    ['ore_a', ORE_COLORS, 'ore_a'],
    ['ore_b', ORE_COLORS, 'ore_b'],
    ['ore_c', ORE_COLORS, 'ore_c'],
  ];
  const sx = 2.6, sz = 2.4;
  rows.forEach(([name, cols], i) => {
    Object.entries(cols).forEach(([cname, hex], j) => {
      const g = new THREE.Group();
      const m = part(name, hex);
      m.position.y = halfH[name];
      g.add(m);
      g.position.set((i - 1.5) * sx, 0, (j - 1) * sz);
      g.rotation.y = 0.6 + i * 0.4 + j * 0.9;
      models.scene.add(g);
      models.spinners.push(g);
      if (j === 2) models.labels.push({ text:name, pos:new THREE.Vector3(g.position.x, 0, g.position.z + 1.25) });
    });
  });
  models.view = { target:new THREE.Vector3(0, 0.2, 0.35), yaw:0.0, pitch:0.55, dist:12.5 };
}

// ---------------------------------------------------------------- pallets view
function pallet(w, d){
  const g = new THREE.Group();
  const wood = plastic(0xa0703f), woodDark = plastic(0x7b532d);
  const slat = new THREE.BoxGeometry(w, 0.18, 0.62);
  const n = Math.round(d / 0.78);
  for (let i = 0; i < n; i++){
    const m = new THREE.Mesh(slat, wood);
    m.position.set(0, 0.5 + 0.09, -d/2 + 0.31 + i * (d - 0.62) / (n - 1));
    m.castShadow = m.receiveShadow = true; g.add(m);
  }
  const beam = new THREE.BoxGeometry(0.5, 0.32, d);
  for (const x of [-w/2 + 0.3, 0, w/2 - 0.3]){
    const m = new THREE.Mesh(beam, woodDark); m.position.set(x, 0.16 + 0.18, 0);
    m.castShadow = m.receiveShadow = true; g.add(m);
  }
  const bot = new THREE.BoxGeometry(w, 0.14, 0.62);
  for (const z of [-d/2 + 0.31, 0, d/2 - 0.31]){
    const m = new THREE.Mesh(bot, wood); m.position.set(0, 0.07, z);
    m.castShadow = m.receiveShadow = true; g.add(m);
  }
  g.userData.top = 0.68;
  return g;
}

const pallets = { scene:makeScene(), spinners:[], labels:[] };
{
  const r = rng(7);
  const ores = ['ore_a', 'ore_b', 'ore_c'];
  // ---- ore pallet: 3 heaps x 16 chunks (12 bottom in 3x4 grid, 4 on top in hollows)
  const op = pallet(11.2, 5.2); op.position.set(-4.4, 0, 0); pallets.scene.add(op);
  const step = 1.06;
  Object.values(ORE_COLORS).forEach((hex, h) => {
    const cx = (h - 1) * 3.55;
    const spots = [];
    for (let a = 0; a < 3; a++) for (let b = 0; b < 4; b++) spots.push([cx + (a - 1) * step, (b - 1.5) * step, 0]);
    const hollow = [];
    for (let a = 0; a < 2; a++) for (let b = 0; b < 3; b++) hollow.push([cx + (a - 0.5) * step, (b - 1) * step, 1]);
    [hollow[0], hollow[1], hollow[4], hollow[5]].forEach(p => spots.push(p));
    spots.forEach(([x, z, layer], k) => {
      const name = ores[Math.floor(r() * 3)];
      const m = part(name, hex);
      const y = op.userData.top + halfH[name] + layer * 0.72;
      m.position.set(x + (r() - 0.5) * 0.08, y, z + (r() - 0.5) * 0.08);
      m.rotation.y = r() * Math.PI * 2;
      if (layer) { m.rotation.x = (r() - 0.5) * 0.25; m.rotation.z = (r() - 0.5) * 0.25; }
      op.add(m);
    });
  });
  pallets.labels.push({ text:'Ore pallet · 3 × 16', pos:new THREE.Vector3(-4.4, 0, 3.2) });

  // ---- bars pallet: 24 ingots, 3 layers of 8, alternating 90° (cross / brick bond)
  const bp = pallet(5.0, 5.0); bp.position.set(5.6, 0, 0); pallets.scene.add(bp);
  const colors = Object.values(BAR_COLORS);
  const W = 0.95, L = 1.9, H = 0.8;
  for (let layer = 0; layer < 3; layer++){
    for (let i = 0; i < 8; i++){
      const m = part('ingot', colors[Math.floor(r() * 3)]);
      const a = i % 4, b = Math.floor(i / 4);
      const across = (a - 1.5) * (W + 0.02), along = (b - 0.5) * (L + 0.02);
      if (layer % 2 === 0) m.position.set(across, 0, along);
      else { m.position.set(along, 0, across); m.rotation.y = Math.PI / 2; }
      m.position.y = bp.userData.top + H/2 + layer * H;
      bp.add(m);
    }
  }
  pallets.labels.push({ text:'Bars pallet · 24', pos:new THREE.Vector3(5.6, 0, 3.2) });
  pallets.view = { target:new THREE.Vector3(0.4, 0.9, 0), yaw:0.32, pitch:0.5, dist:22 };
}

// ---------------------------------------------------------------- camera + controls
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 400);
let cur = params.get('view') === 'pallets' ? pallets : models;
// optional camera overrides via URL: ?dist=..&yaw=..&pitch=..&tx=..&ty=..&tz=..
{ const v = cur.view; for (const k of ['dist','yaw','pitch']) if (params.has(k)) v[k] = +params.get(k);
  for (const k of ['x','y','z']) if (params.has('t'+k)) v.target[k] = +params.get('t'+k); }

function place(){
  const v = cur.view;
  camera.position.set(
    v.target.x + v.dist * Math.cos(v.pitch) * Math.sin(v.yaw),
    v.target.y + v.dist * Math.sin(v.pitch),
    v.target.z + v.dist * Math.cos(v.pitch) * Math.cos(v.yaw));
  camera.lookAt(v.target);
}

  if (!drag) return;
  const v = cur.view;
  v.yaw -= (e.clientX - drag.x) * 0.008;
  v.pitch = Math.min(1.45, Math.max(0.05, v.pitch + (e.clientY - drag.y) * 0.006));
  drag = { x:e.clientX, y:e.clientY };
});
addEventListener('pointerup', () => drag = null);
renderer.domElement.addEventListener('wheel', e => {
  e.preventDefault();
  cur.view.dist = Math.min(60, Math.max(3, cur.view.dist * Math.exp(e.deltaY * 0.001)));
}, { passive:false });

const labelsEl = document.getElementById('labels');
function buildLabels(){
  labelsEl.innerHTML = '';
  cur.labels.forEach(l => { const d = document.createElement('div'); d.className = 'lbl'; d.textContent = l.text; labelsEl.appendChild(d); l.el = d; });
}
function setView(v){
  cur = v; buildLabels();
  document.getElementById('bModels').classList.toggle('on', v === models);
  document.getElementById('bPallets').classList.toggle('on', v === pallets);
}
document.getElementById('bModels').onclick = () => setView(models);
document.getElementById('bPallets').onclick = () => setView(pallets);
const bSpin = document.getElementById('bSpin');
bSpin.onclick = () => { spin = !spin; bSpin.textContent = 'Обертання: ' + (spin ? 'так' : 'ні'); };
bSpin.textContent = 'Обертання: ' + (spin ? 'так' : 'ні');
setView(cur);

function resize(){
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const tmp = new THREE.Vector3();
let last = performance.now();
function frame(t){
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (spin) models.spinners.forEach(g => g.rotation.y += dt * 0.6);
  place();
  renderer.render(cur.scene, camera);
  cur.labels.forEach(l => {
    tmp.copy(l.pos).project(camera);
    l.el.style.left = ((tmp.x + 1) / 2 * innerWidth) + 'px';
    l.el.style.top = ((1 - tmp.y) / 2 * innerHeight) + 'px';
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
