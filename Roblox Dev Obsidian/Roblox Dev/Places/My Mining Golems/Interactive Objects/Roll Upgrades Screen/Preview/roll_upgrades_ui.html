<h1>Roll Upgrades — UI табла (вектор)</h1>
<p>Дві вертикальні картки на 2D-підкладці зі studs, пропорції полотна табла (≈ 2,08 : 1). Числа за GDD: Roll Luck 5% + 5% за рівень (ціна 1 000, ×4, ×3,95 …), Roll Stands 1 → 5 (500, 1 500, 4 500, 13 500). Кнопки натискаються, перемикач показує MAX.</p>

<div class="bar"><button id="toggle">Roll Stands: MAX / з початку</button><button id="reset">Скинути</button></div>
</div>
<script>
const $ = id => document.getElementById(id);
// числа за GDD: Roll Luck рівень n = 5n %, ціна 1 000 → ×(4 − 0.05·(n−1)), мін. ×1.25; місця ролу 1 → 5, ціни 500 × 3^(k−1)
function luckPrice(lv){ let p = 1000; for (let n = 1; n < lv; n++) p = Math.floor(p * Math.max(1.25, 4 - 0.05 * (n - 1))); return p; }
function standPrice(k){ return k >= 5 ? null : Math.floor(500 * Math.pow(3, k - 1)); }
const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
function money(n){ if (n < 1e6) return '$' + n.toLocaleString('en-US'); let i = 0; while (n >= 1000 && i < SUF.length - 1) { n /= 1000; i++; } return '$' + (Math.floor(n * 100) / 100).toString() + SUF[i]; }
let lv, stands;
function render(){
  $('luckCur').textContent = (5 * lv) + '%';
  $('luckNext').textContent = (5 * (lv + 1)) + '%';
  $('btnText_luck').textContent = money(luckPrice(lv));
  const card = document.querySelector('#btn_stands').parentNode;
  const val = [...card.querySelectorAll('text')].find(e => !e.closest('.btn') && /MAX|›/.test(e.textContent));
  const sp = standPrice(stands);
  if (sp === null) { val.innerHTML = 'MAX (5)'; $('btnText_stands').textContent = 'MAX'; setBtn('grayG'); }
  else { val.innerHTML = '<tspan fill="#fff">' + stands + '</tspan> <tspan fill="#d4ff3e">› ' + (stands + 1) + '</tspan>'; $('btnText_stands').textContent = money(sp); setBtn('limeG'); }
}
function setBtn(g){ $('btn_stands').querySelector('rect').setAttribute('fill', 'url(#' + g + ')'); }
function reset(){ lv = 1; stands = 1; render(); }
function pop(el){ el.classList.remove('pop'); void el.getBoundingClientRect(); el.classList.add('pop'); }
$('btn_luck').addEventListener('click', () => { lv++; render(); pop($('luckCur')); pop($('luckNext')); });
$('btn_stands').addEventListener('click', () => { if (stands < 5) { stands++; render(); } });
$('toggle').onclick = () => { stands = stands >= 5 ? 1 : 5; render(); };
$('reset').onclick = reset;
document.fonts.ready.then(reset);
</script></body></html>
