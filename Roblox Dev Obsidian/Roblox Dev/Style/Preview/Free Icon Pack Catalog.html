<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Icon Pack Catalog</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Rubik:wght@400;500&display=swap"><style>
/* layout: sticky toolbar over category sections; each section is a grid of icon tiles on a switchable backdrop */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --fg:#15202e; --muted:#5d6b7e; --line:#d8dee8;
  --accent:#2f6bff; --accent-fg:#ffffff; --stage:#dfe6f0;
  --font-display:'Fredoka','Trebuchet MS',sans-serif; --font-body:'Rubik','Segoe UI',sans-serif;
  --tile:96px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1520; --surface:#18212f; --fg:#e8eef8; --muted:#93a1b6; --line:#2a3647; --accent:#6f95ff; --accent-fg:#0b1220; --stage:#243044; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1520; --surface:#18212f; --fg:#e8eef8; --muted:#93a1b6; --line:#2a3647; --accent:#6f95ff; --accent-fg:#0b1220; --stage:#243044; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:1240px;margin:0 auto}
h1{font-family:var(--font-display);font-weight:600;font-size:26px;margin:0 0 4px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 14px;max-width:70ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
input[type=search]{flex:1 1 200px;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);font:inherit}
label.ctl{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
input[type=range]{accent-color:var(--accent);width:110px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--fg);padding:7px 11px;font:inherit;font-size:13px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:5px 11px;border-radius:99px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip small{opacity:.7;margin-left:4px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{margin-top:26px}
section>h2{font-family:var(--font-display);font-weight:500;font-size:20px;margin:0 0 10px;display:flex;align-items:baseline;gap:10px}
section>h2 span{font-family:var(--font-body);font-size:13px;color:var(--muted);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--tile) + 36px),1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-width:0;color:inherit;font:inherit;text-align:center}
.tile:hover{border-color:var(--accent)}
.stage{width:calc(var(--tile) + 12px);height:calc(var(--tile) + 12px);display:grid;place-items:center;border-radius:6px;background:var(--stage)}
.stage[data-bg=checker]{background:conic-gradient(#c9d1dc 25%,#e8edf3 0 50%,#c9d1dc 0 75%,#e8edf3 0) 0 0/16px 16px}
.stage[data-bg=sky]{background:#86a3c2}
.stage[data-bg=dark]{background:#1b2230}
.stage img{width:var(--tile);height:var(--tile);object-fit:contain;display:block}
.nm{font-size:12px;line-height:1.25;overflow-wrap:anywhere}
.gp{font-size:11px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .15s;max-width:90vw;z-index:20}
.toast.on{opacity:1}
.none{color:var(--muted);padding:30px 0}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
html{color-scheme:light}</style></head><body>

var MODE="file";
var BASE="Free Icon Pack v3.1 (Basic)/";
var CATS=["Main","Currency","Item","UI","Player","Nature","Food","Animal","Exclusive","Social"];
var cat="all",bg="plain",qv="";
var $=function(i){return document.getElementById(i)};
function src(it){return MODE==="embed"?"data:image/webp;base64,"+it.i:encodeURI(BASE+it.p)}
function counts(){var c={};ITEMS.forEach(function(it){c[it.c]=(c[it.c]||0)+1});return c}
function chips(){
  var c=counts(),h='<button class="chip" data-c="all" aria-pressed="'+(cat==="all")+'">Усі<small>'+ITEMS.length+'</small></button>';
  CATS.forEach(function(k){if(c[k])h+='<button class="chip" data-c="'+k+'" aria-pressed="'+(cat===k)+'">'+k+'<small>'+c[k]+'</small></button>'});
  $("chips").innerHTML=h;
}
function esc(s){return s.replace(/[&<>"]/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]})}
function render(){
  var out="",any=false;
  CATS.forEach(function(k){
    if(cat!=="all"&&cat!==k)return;
    var list=ITEMS.filter(function(it){return it.c===k&&(!qv||(it.n+" "+it.g).toLowerCase().indexOf(qv)>-1)});
    if(!list.length)return;any=true;
    out+='<section><h2>'+k+'<span>'+list.length+' шт.</span></h2><div class="grid">';
    list.forEach(function(it){
      out+='<button class="tile" data-p="'+esc(it.p)+'" title="'+esc(it.p)+'"><span class="stage" data-bg="'+bg+'"><img loading="lazy" alt="'+esc(it.n)+'" src="'+src(it)+'"></span><span class="nm">'+esc(it.n)+'</span><span class="gp">'+esc(it.g)+'</span></button>';
    });
    out+='</div></section>';
  });
  $("out").innerHTML=any?out:'<p class="none">Нічого не знайдено.</p>';
}
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("on")},1600)}
function copy(t){
  function fb(){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove()}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).catch(fb)}else fb();
  toast("Скопійовано: "+t);
}
$("q").addEventListener("input",function(e){qv=e.target.value.trim().toLowerCase();render()});
$("sz").addEventListener("input",function(e){document.documentElement.style.setProperty("--tile",e.target.value+"px")});
$("bgs").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;bg=b.dataset.bg;
  [].forEach.call($("bgs").children,function(x){x.setAttribute("aria-pressed",x===b)});
  [].forEach.call(document.querySelectorAll(".stage"),function(s){s.dataset.bg=bg})});
$("chips").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;cat=b.dataset.c;chips();render()});
$("out").addEventListener("click",function(e){var t=e.target.closest(".tile");if(t)copy(t.dataset.p)});
chips();render();
</script>
